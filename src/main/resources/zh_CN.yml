# FreeCoreGuild 全部玩家语言配置（UTF-8）
# 代码只引用语言键，不再内嵌中文默认文案。缺失键会在启动/重载时补入，已有自定义值不覆盖。
# 菜单: menus；商城界面: shop-menu；职位: roles；聊天: chat；广播: broadcast；服务原因: results。
# 截图基地提示: menus.main.base-lore-admin / base-lore-member / base-lore-desc。
# 修改后使用 /guild reload，关闭并重新打开菜单查看效果。
# {name}、{role} 等为占位符，请保留需要显示的数据。

# FreeCore 统一语言与 GUI 菜单文案配置文件
# 规范要求：
# 1. 消息头：<插件功能> &f&l>>> &f这是范例信息 (例如 &b&l公会 &f&l>>> &f...)
# 2. 文本颜色：以单色为主，关键数字/名字部分用 &b 或 &e。&c消极，&6中性，&a奖励与成功
# 3. 标点符号：中文语句中尽量使用全角符号 [，] [。] [！] [“”] 等
prefix: '&b&l公会 &f&l>>> &f'

